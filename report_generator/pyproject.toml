[project]
name = "report_generator"
version = "0.1.0"
description = "report_generator using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=0.177.0,<1.0.0",
    "jsonpointer>=2.0",
    "langchain-community>=0.3.29",
    "langchain-core>=0.3.75",
    "langchain-openai>=0.1.0",
    "langchain-qdrant>=0.2.0",
    "qdrant-client>=1.15.1",
    "mlflow>=2.0.0",
    "ragas>=0.3.3",
]

[project.scripts]
kickoff = "report_generator.main:kickoff"
run_crew = "report_generator.main:kickoff"
plot = "report_generator.main:plot"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
